<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chameleon Dashboard</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦎 Chameleon</h1>
            <p class="subtitle">Fingerprint Auditor</p>
        </div>

        <div class="status-card">
            <div class="status-indicator active"></div>
            <div class="status-text">
                <strong>Protection Active</strong>
                <p>Fingerprinting APIs are being spoofed</p>
            </div>
        </div>

        <div class="section">
            <h2>🛡️ Protected APIs</h2>
            <div class="api-list">
                <div class="api-item protected">
                    <span>Canvas</span>
                    <span class="badge">✓</span>
                </div>
                <div class="api-item protected">
                    <span>WebGL</span>
                    <span class="badge">✓</span>
                </div>
                <div class="api-item protected">
                    <span>AudioContext</span>
                    <span class="badge">✓</span>
                </div>
                <div class="api-item protected">
                    <span>Navigator</span>
                    <span class="badge">✓</span>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>📊 Statistics</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value">4</div>
                    <div class="stat-label">APIs Protected</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">0</div>
                    <div class="stat-label">Blocked Attempts</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Extension Status: <span class="status-ok">Active</span></p>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
