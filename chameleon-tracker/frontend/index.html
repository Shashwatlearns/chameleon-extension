<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chameleon - Browser Fingerprint Tracker</title>
    <style>
        :root {
            --background: #09090b;
            --foreground: #fafafa;
            --card: #09090b;
            --card-foreground: #fafafa;
            --popover: #09090b;
            --popover-foreground: #fafafa;
            --primary: #fafafa;
            --primary-foreground: #18181b;
            --secondary: #27272a;
            --secondary-foreground: #fafafa;
            --muted: #27272a;
            --muted-foreground: #a1a1aa;
            --accent: #27272a;
            --accent-foreground: #fafafa;
            --destructive: #7f1d1d;
            --destructive-foreground: #fafafa;
            --border: #27272a;
            --input: #27272a;
            --ring: #d4d4d8;
            --radius: 0.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--muted-foreground);
            margin-bottom: 24px;
        }

        .admin-link {
            display: inline-block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--foreground);
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 2px);
            transition: background-color 0.2s;
        }

        .admin-link:hover {
            background-color: var(--accent);
            color: var(--accent-foreground);
        }

        .card {
            background-color: var(--card);
            color: var(--card-foreground);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 16px;
        }

        .fingerprint-id {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 1.125rem;
            font-weight: 500;
            text-align: center;
            padding: 16px;
            background-color: var(--muted);
            border-radius: calc(var(--radius) - 2px);
            margin-bottom: 24px;
            word-break: break-all;
            letter-spacing: 0.05em;
        }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: calc(var(--radius) - 2px);
            margin-bottom: 24px;
            font-weight: 500;
            font-size: 0.875rem;
            border: 1px solid var(--border);
            background-color: var(--background);
        }

        .status.collecting {
            color: #fb923c;
            border-color: rgba(251, 146, 60, 0.2);
            background-color: rgba(251, 146, 60, 0.05);
        }

        .status.complete {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.2);
            background-color: rgba(74, 222, 128, 0.05);
        }
        
        .status.error {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
            background-color: rgba(248, 113, 113, 0.05);
        }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .detail-item {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 2px);
            background-color: var(--background);
        }

        .detail-label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--muted-foreground);
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 0.875rem;
            font-weight: 500;
            word-break: break-word;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 40px;
            padding: 0 16px;
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            border-radius: calc(var(--radius) - 2px);
            cursor: pointer;
            transition: colors 0.2s;
            outline: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }

        .btn-primary:hover {
            background-color: rgba(250, 250, 250, 0.9);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .server-response {
            margin-top: 16px;
            padding: 12px;
            border-radius: calc(var(--radius) - 2px);
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
            border: 1px solid var(--border);
        }

        .server-response.success {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.2);
            background-color: rgba(74, 222, 128, 0.05);
            display: block;
        }

        .server-response.error {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
            background-color: rgba(248, 113, 113, 0.05);
            display: block;
        }

        .loader {
            border: 2px solid var(--muted);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 16px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .canvas-preview {
            margin-top: 16px;
            text-align: center;
        }

        .canvas-preview canvas {
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 2px);
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Chameleon</h1>
            <p class="subtitle">Browser Fingerprint Tracker - Research System</p>
            <a href="dashboard.html" class="admin-link">View Admin Dashboard &rarr;</a>
        </div>

        <div class="card">
            <div class="status collecting" id="status">
                Collecting fingerprint data...
            </div>

            <div class="fingerprint-id" id="fingerprintId">
                Generating fingerprint...
            </div>

            <button class="btn-primary" id="sendBtn" disabled>
                Send to Server
            </button>
            
            <div class="server-response" id="serverResponse"></div>
            <div class="loader" id="loader"></div>
        </div>

        <div class="card">
            <h2 class="card-title">Fingerprint Details</h2>
            <div class="details" id="details">
                <!-- Details will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="fingerprint.js"></script>
</body>
</html>
